<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clan Dashboard Advanced</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --bg:#071421;
      --card:#101d2d;
      --card-2:#122437;
      --mut:#9bb6c9;
      --text:#eef7f6;
      --line:rgba(255,255,255,0.05);
      --green:#38d39f;
      --cyan:#5ec9ff;
      --yellow:#ffcc66;
      --red:#ff7b7b;
      --shadow:0 12px 28px rgba(0,0,0,0.25);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg,#071421,#0a1a2b 50%,#09141d);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 16px 50px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    .brand .mut {
      color: var(--mut);
      font-size: 0.82rem;
    }

    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .controls select, .controls input, .controls button {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      font-size: 0.9rem;
    }

    .search {
      min-width: 260px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 14px 16px;
    }

    .label {
      color: var(--mut);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }

    .value {
      font-weight: 800;
      font-size: 2rem;
      line-height: 1.2;
      margin-top: 8px;
    }

    .sub {
      margin-top: 6px;
      color: var(--mut);
      font-size: 0.78rem;
    }

    .details {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 12px;
      margin-top: 12px;
    }

    .table-wrap {
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: var(--text);
    }

    th, td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--mut);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      font-size: 0.72rem;
    }

    .war-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .war-box {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      padding: 12px;
      border-radius: 12px;
    }

    .war-box h3 {
      margin: 0 0 8px;
      font-size: 0.9rem;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .big-score {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 8px 0;
    }

    .small {
      font-size: 0.8rem;
      color: var(--mut);
    }

    .history-box {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
    }

    .chart-wrap {
      height: 180px;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
      .details { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .search { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <h1 id="title">Clan Dashboard</h1>
        <div class="mut" id="meta">Memuat…</div>
      </div>

      <div class="controls">
        <select id="clanSelect"></select>
        <input id="memberSearch" class="search" placeholder="Cari nama / role / TH..." />
        <button id="refreshBtn" type="button">Refresh</button>
        <button id="exportCsv" type="button">Export CSV</button>
      </div>
    </div>

    <div class="grid" id="overviewGrid"></div>

    <div class="card" style="margin-top:16px;">
      <div class="label">Top donor 7 hari</div>
      <div class="chart-wrap">
        <canvas id="donationChart"></canvas>
      </div>
    </div>

    <div class="details" style="margin-top:16px;">
      <div class="card">
        <div class="label">War</div>
        <div id="warBox"></div>
      </div>

      <div class="card">
        <div class="label">Perubahan terbaru</div>
        <div id="diffBox" class="small"></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="label">Daftar anggota</div>
      <div class="table-wrap">
        <table id="memberTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Nama</th>
              <th>Role</th>
              <th>TH</th>
              <th>Trophies</th>
              <th>Donasi</th>
              <th>Terima</th>
              <th>Capital</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="card history-box" style="margin-top:16px;">
      <div class="label">Riwayat run</div>
      <div id="historyBox" class="small"></div>
    </div>
  </div>

    function fmt(n) {
      if (n === null || n === undefined || isNaN(Number(n))) return "-";
      return Number(n).toLocaleString("id-ID");
    }

    function safe(v, fallback = "-") {
      return v == null || v === "" ? fallback : v;
    }

    // Normalize tag keys so we can match both "#ABC" and "ABC"
    function normTagKey(t) {
      if (!t) return "";
      return String(t).replace(/^#/, "").toUpperCase();
    }

    // Resolve a tag to the actual key present in DATA.clans (if any)
    function resolveClanKey(tag) {
      const clans = DATA.clans || {};
      const map = {};
      Object.keys(clans).forEach(k => { map[normTagKey(k)] = k; });
      return map[normTagKey(tag)] || tag;
    }

    function getClanObj(tag) {
      const key = resolveClanKey(tag);
      return { key, clan: (DATA.clans || {})[key] || null };
    }

    function renderOverviewCards(clan) {
      const grid = $('overviewGrid');
      grid.innerHTML = '';

      const items = [
        { label: "Members", value: clan && clan.memberCount },
        { label: "Points", value: clan && clan.points },
        { label: "War record", value: clan ? `${clan.warWins ?? 0}W / ${clan.warLosses ?? 0}L / ${clan.warTies ?? 0}T` : '-' },
        { label: "Capital Hall", value: clan && clan.capitalHall ? `Lv ${clan.capitalHall}` : "-" },
      ];

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="label">${item.label}</div>
          <div class="value">${safe(item.value)}</div>
          <div class="sub">${item.label === "Members" ? "Total member" : item.label === "Points" ? "Clan points" : item.label === "War record" ? "W/L/T" : "Capital hall level"}</div>
        `;
        grid.appendChild(card);
      });
    }

    function renderDonationChart(clanTag) {
      const key = resolveClanKey(clanTag);
      const weekly = (DATA.meta && DATA.meta[key] && DATA.meta[key].weekly_top) || [];
      const labels = weekly.map(x => x[0]);
      const vals = weekly.map(x => x[1]);

      const ctx = $('donationChart').getContext('2d');

      if (window.donationChart) {
        window.donationChart.destroy();
      }

      window.donationChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Donasi 7 hari',
            data: vals,
            backgroundColor: 'rgba(92,201,255,0.9)'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } }
        }
      });
    }

    function renderWar(clanTag) {
      const box = $('warBox');
      const key = resolveClanKey(clanTag);
      const war = (DATA.wars || {})[key];
      if (!war || war.state === 'notInWar') {
        box.innerHTML = '<div class="small">Tidak ada war aktif atau war log private.</div>';
        return;
      }

      const us = war.us || {};
      const them = war.them || {};
      box.innerHTML = `
        <div class="war-summary">
          <div class="war-box">
            <h3>${safe(us.name, 'Kamu')}</h3>
            <div class="big-score">${safe(us.stars, 0)} ★</div>
            <div class="small">Persen: ${safe(us.pct, 0)}%</div>
            <div class="small">Serangan: ${safe(us.attacks, 0)}</div>
          </div>
          <div class="war-box">
            <h3>${safe(them.name, 'Lawan')}</h3>
            <div class="big-score">${safe(them.stars, 0)} ★</div>
            <div class="small">Persen: ${safe(them.pct, 0)}%</div>
            <div class="small">Serangan: ${safe(them.attacks, 0)}</div>
          </div>
        </div>
      `;
    }

    function renderDiffs(clanTag) {
      const diffBox = $('diffBox');
      const key = resolveClanKey(clanTag);
      const diffList = (DATA.meta && DATA.meta[key] && DATA.meta[key].diffs) || [];
      if (!diffList || !diffList.length) {
        diffBox.innerHTML = '<div class="small">Tidak ada perubahan sejak snapshot terakhir.</div>';
        return;
      }
      diffBox.innerHTML = diffList.map(d => `<div>${d}</div>`).join('');
    }

    function renderMembers(clanTag, filterText) {
      const tbody = $('memberTable').querySelector('tbody');
      tbody.innerHTML = '';
      const clan = getClanObj(clanTag).clan;
      if (!clan) {
        tbody.innerHTML = '<tr><td colspan="8">Clan tidak ditemukan.</td></tr>';
        return;
      }

      const members = (clan.memberList || []).slice().sort((a,b)=> (b.donations||0)-(a.donations||0));
      const ft = (filterText||'').toLowerCase().trim();

      members.forEach((m, idx) => {
        const name = m.name || '';
        const role = m.role || '';
        const th = m.th || m.townHallLevel || '';
        const trophies = m.trophies || '';
        const donations = m.donations || 0;
        const received = m.received || 0;
        const capital = m.capitalContributions || 0;

        const rowText = `${name} ${role} ${th}`.toLowerCase();
        if (ft && !rowText.includes(ft)) return;

        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${idx+1}</td>
          <td>${name}</td>
          <td>${role}</td>
          <td>${th}</td>
          <td>${fmt(trophies)}</td>
          <td>${fmt(donations)}</td>
          <td>${fmt(received)}</td>
          <td>${fmt(capital)}</td>`;
        tbody.appendChild(tr);
      });

      if (!tbody.children.length) {
        tbody.innerHTML = '<tr><td colspan="8">Tidak ada anggota sesuai filter.</td></tr>';
      }
    }

    function renderHistory(clanTag) {
      const hb = $('historyBox');
      const all = DATA.history || [];
      const nkey = normTagKey(clanTag);
      const items = all.filter(e=> normTagKey(e.clanTag) === nkey ).slice(-30).reverse();
      if (!items.length) {
        hb.innerHTML = '<div>Tidak ada riwayat.</div>';
        return;
      }
      hb.innerHTML = items.map(i=> `<div>${i.ts} — ${i.memberCount} anggota</div>`).join('');
    }

    function exportCsv(clanTag) {
      const clan = getClanObj(clanTag).clan;
      if (!clan) return;
      const rows = [['tag','name','role','th','trophies','donations','received','capital']];
      for (const m of (clan.memberList||[])) {
        rows.push([
          (m.tag||''),
          (m.name||''),
          (m.role||''),
          (m.th||m.townHallLevel||''),
          (m.trophies||0),
          (m.donations||0),
          (m.received||m.donationsReceived||0),
          (m.capitalContributions||m.clanCapitalContributions||0),
        ]);
      }
      const csv = rows.map(r=> r.map(c=> '"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
      const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${((getClanObj(clanTag).clan && getClanObj(clanTag).clan.name) || clanTag).replace(/[^a-z0-9_-]/gi,'_')}_members.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function initUI() {
      const select = $('clanSelect');
      select.innerHTML = '';
      const keys = Object.keys(DATA.clans || {});
      if (!keys.length) {
        $('meta').textContent = 'Tidak ada data clan tersedia.';
        return;
      }
      keys.sort();
      keys.forEach(k=>{
        const opt = document.createElement('option');
        opt.value = k;
        opt.textContent = `${(DATA.clans[k].name||k)} (${k})`;
        select.appendChild(opt);
      });

      const first = select.value || keys[0];
      const firstObj = getClanObj(first);
      $('title').textContent = (firstObj.clan && firstObj.clan.name) ? `Clan Dashboard — ${firstObj.clan.name}` : 'Clan Dashboard';
      $('meta').textContent = `Generated: ${DATA.generated || 'N/A'}`;

      function renderAll() {
        const sel = select.value || keys[0];
        const { key: clanKey, clan } = getClanObj(sel);
        renderOverviewCards(clan || {});
        renderDonationChart(clanKey);
        renderWar(clanKey);
        renderDiffs(clanKey);
        renderMembers(clanKey, $('memberSearch').value);
        renderHistory(clanKey);
      }

      select.addEventListener('change', ()=>{
        renderAll();
      });

      $('memberSearch').addEventListener('input', ()=>{
        renderMembers(select.value, $('memberSearch').value);
      });

      $('refreshBtn').addEventListener('click', ()=> location.reload());
      $('exportCsv').addEventListener('click', ()=> exportCsv(select.value));

      renderAll();
      // Resize chart on window resize to keep layout
      window.addEventListener('resize', ()=> { if (window.donationChart) window.donationChart.resize(); });
    }

    // Initialize when DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initUI);
    } else {
      initUI();
    }
  </script>
</body>
</html>
