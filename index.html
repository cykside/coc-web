<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clan Dashboard Advanced</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --bg:#071421;
      --card:#101d2d;
      --card-2:#122437;
      --mut:#9bb6c9;
      --text:#eef7f6;
      --line:rgba(255,255,255,0.05);
      --green:#38d39f;
      --cyan:#5ec9ff;
      --yellow:#ffcc66;
      --red:#ff7b7b;
      --shadow:0 12px 28px rgba(0,0,0,0.25);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg,#071421,#0a1a2b 50%,#09141d);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 16px 50px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    .brand .mut {
      color: var(--mut);
      font-size: 0.82rem;
    }

    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .controls select, .controls input, .controls button {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      font-size: 0.9rem;
    }

    .search {
      min-width: 260px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 14px 16px;
    }

    .label {
      color: var(--mut);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }

    .value {
      font-weight: 800;
      font-size: 2rem;
      line-height: 1.2;
      margin-top: 8px;
    }

    .sub {
      margin-top: 6px;
      color: var(--mut);
      font-size: 0.78rem;
    }

    .details {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 12px;
      margin-top: 12px;
    }

    .table-wrap {
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: var(--text);
    }

    th, td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--mut);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      font-size: 0.72rem;
    }

    .war-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .war-box {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      padding: 12px;
      border-radius: 12px;
    }

    .war-box h3 {
      margin: 0 0 8px;
      font-size: 0.9rem;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .big-score {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 8px 0;
    }

    .small {
      font-size: 0.8rem;
      color: var(--mut);
    }

    .history-box {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
    }

    .chart-wrap {
      height: 180px;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
      .details { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .search { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <h1 id="title">Clan Dashboard</h1>
        <div class="mut" id="meta">Memuat…</div>
      </div>

      <div class="controls">
        <select id="clanSelect"></select>
        <input id="memberSearch" class="search" placeholder="Cari nama / role / TH..." />
        <button id="refreshBtn" type="button">Refresh</button>
        <button id="exportCsv" type="button">Export CSV</button>
      </div>
    </div>

    <div class="grid" id="overviewGrid"></div>

    <div class="card" style="margin-top:16px;">
      <div class="label">Top donor 7 hari</div>
      <div class="chart-wrap">
        <canvas id="donationChart"></canvas>
      </div>
    </div>

    <div class="details" style="margin-top:16px;">
      <div class="card">
        <div class="label">War</div>
        <div id="warBox"></div>
      </div>

      <div class="card">
        <div class="label">Perubahan terbaru</div>
        <div id="diffBox" class="small"></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="label">Daftar anggota</div>
      <div class="table-wrap">
        <table id="memberTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Nama</th>
              <th>Role</th>
              <th>TH</th>
              <th>Trophies</th>
              <th>Donasi</th>
              <th>Terima</th>
              <th>Capital</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="card history-box" style="margin-top:16px;">
      <div class="label">Riwayat run</div>
      <div id="historyBox" class="small"></div>
    </div>
  </div>

    const $ = id => document.getElementById(id);

    function fmt(n) {
      if (n === null || n === undefined || isNaN(Number(n))) return "-";
      return Number(n).toLocaleString("id-ID");
    }

    function safe(v, fallback = "-") {
      return v == null || v === "" ? fallback : v;
    }

    function renderOverviewCards(clan) {
      const grid = $('overviewGrid');
      grid.innerHTML = '';

      const items = [
        { label: "Members", value: clan.memberCount },
        { label: "Points", value: clan.points },
        { label: "War record", value: `${clan.warWins ?? 0}W / ${clan.warLosses ?? 0}L / ${clan.warTies ?? 0}T` },
        { label: "Capital Hall", value: clan.capitalHall ? `Lv ${clan.capitalHall}` : "-" },
      ];

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="label">${item.label}</div>
          <div class="value">${safe(item.value)}</div>
          <div class="sub">${item.label === "Members" ? "Total member" : item.label === "Points" ? "Clan points" : item.label === "War record" ? "W/L/T" : "Capital hall level"}</div>
        `;
        grid.appendChild(card);
      });
    }

    function renderDonationChart(clanTag) {
      const weekly = (DATA.meta && DATA.meta[clanTag] && DATA.meta[clanTag].weekly_top) || [];
      const labels = weekly.map(x => x[0]);
      const vals = weekly.map(x => x[1]);

      const ctx = $('donationChart').getContext('2d');

      if (window.donationChart) {
        window.donationChart.destroy();
      }

      window.donationChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Donasi 7 hari',
            data: vals,
            backgroundColor: 'rgba(92,201,255,0.9)'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } }
        }
      });
    }

    function renderWar(clanTag) {
      const box = $('warBox');
      const war = (DATA.wars || {})[clanTag];
      if (!war || war.state === 'notInWar') {
        box.innerHTML = '<div class=\"small\">Tidak ada war aktif atau war log private.</div>';
        return;
      }

      const us = war.us || {};
      const them = war.them || {};
      box.innerHTML = `
        <div class="war-summary">
          <div class="war-box">
            <h3>${safe(us.name, 'Kamu')}</h3>
            <div class="big-score">${safe(us.stars, 0)} ★</div>
            <div class="small">Persen: ${safe(us.pct, 0)}%</div>
            <div class="small">Serangan: ${safe(us.attacks, 0)}</div>
          </div>
          <div class="war-box">
            <h3>${safe(them.name, 'Lawan')}</h3>
            <div class="big-score">${safe(them.stars, 0)} ★</div>
            <div class="small">Persen: ${safe(them.pct, 0)}%</div>
            <div class="small">Serangan: ${safe(them.attacks, 0)}</div>
          </div>
        </div>
      `;
    }

    function renderDiffs(clanTag) {
      const diffBox = $('diffBox');
      const diffList = (DATA.meta && DATA.meta[clanTag] && DATA.meta[clanTag].diffs) || [];
      if (!diffList.length) {
        diffBox.innerHTML
